opencli: "0.1"

info:
  title: spaceship
  version: "1.1.0"
  summary: CLI for the Spaceship domain registrar API
  description: >
    A command-line interface for the Spaceship API that manages domains,
    personal nameservers, DNS records, contacts, SellerHub listings and SafePay,
    Hyperlift applications, and async operations.
    Designed for automation and LLM-friendly output (YAML-first).
  contact:
    url: https://github.com/nielsbosma/Spaceship.Console
  license:
    identifier: MIT

conventions:
  groupOptions: true
  optionArgumentSeparator: " "

options:
  - name: --api-key
    description: Override the SPACESHIP_API_KEY environment variable
    arguments:
      - name: key
        required: true
        arity: { minimum: 1, maximum: 1 }
  - name: --api-secret
    description: Override the SPACESHIP_API_SECRET environment variable
    arguments:
      - name: secret
        required: true
        arity: { minimum: 1, maximum: 1 }
  - name: --format
    description: Output format
    arguments:
      - name: format
        required: true
        arity: { minimum: 1, maximum: 1 }
        acceptedValues:
          - yaml
          - json
          - table
  - name: --no-color
    description: Disable colored output
  - name: --verbose
    description: Print HTTP method, URL, and status code to stderr
  - name: --version
    description: Print version and exit
  - name: --help
    description: Print help and exit
    aliases:
      - -h

exitCodes:
  - code: 0
    description: Success
  - code: 1
    description: User or input error
  - code: 2
    description: API or network error

commands:
  # ── domains ────────────────────────────────────────────
  - name: domains
    description: Domain management
    commands:
      - name: list
        description: List all domains
        options:
          - name: --order-by
            description: Sort field
            arguments:
              - name: sort
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - name
                  - unicodeName
                  - registrationDate
                  - expirationDate
          - name: --take
            description: Number of items to return (1-100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --skip
            description: Number of items to skip
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: get
        description: Get domain details
        arguments:
          - name: domain
            required: true
            description: Domain name in ASCII format

      - name: check
        description: Check domain availability
        arguments:
          - name: domain
            required: true
            description: Domain name to check

      - name: check-batch
        description: Check availability of multiple domains
        arguments:
          - name: domains
            required: true
            description: Comma-separated domain names (max 20)

      - name: register
        description: Register a new domain
        arguments:
          - name: domain
            required: true
            description: Domain name to register
        options:
          - name: --years
            description: Registration period (1-10)
            arguments:
              - name: years
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --auto-renew
            description: Enable auto-renewal
          - name: --privacy
            description: Privacy protection level
            arguments:
              - name: level
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - high
                  - public
          - name: --registrant
            required: true
            description: Registrant contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --admin
            description: Admin contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --tech
            description: Tech contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --billing
            description: Billing contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: delete
        description: Delete a domain (the API currently returns 501 Not Implemented)
        arguments:
          - name: domain
            required: true
            description: Domain name to delete

      - name: renew
        description: Renew a domain
        arguments:
          - name: domain
            required: true
            description: Domain name to renew
        options:
          - name: --years
            description: Renewal period (1-10)
            arguments:
              - name: years
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --expiration-date
            required: true
            description: Current expiration date (ISO 8601)
            arguments:
              - name: date
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: restore
        description: Restore a deleted domain
        arguments:
          - name: domain
            required: true
            description: Domain name to restore

      - name: autorenew
        description: Enable or disable auto-renewal
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --enable
            description: Enable auto-renewal
          - name: --disable
            description: Disable auto-renewal

      - name: nameservers
        description: Set domain nameservers
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --provider
            required: true
            description: Nameserver provider
            arguments:
              - name: provider
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - basic
                  - custom
          - name: --hosts
            description: Comma-separated nameserver hosts (2-12, required for custom)
            arguments:
              - name: hosts
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: contacts
        description: Set domain contacts
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --registrant
            required: true
            description: Registrant contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --admin
            description: Admin contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --tech
            description: Tech contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --billing
            description: Billing contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: privacy
        description: Set domain privacy level
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --level
            required: true
            description: Privacy protection level
            arguments:
              - name: level
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - public
                  - high

      - name: email-protection
        description: Enable or disable email protection (contact form)
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --enable
            description: Enable the contact form
          - name: --disable
            description: Disable the contact form

      - name: personal-ns
        description: Personal nameservers (glue records)
        commands:
          - name: list
            description: List personal nameservers
            arguments:
              - name: domain
                required: true
                description: Domain name
          - name: save
            description: Create or update a personal nameserver
            arguments:
              - name: domain
                required: true
                description: Domain name
              - name: host
                required: true
                description: Host label or FQDN, e.g. ns1 or ns1.example.com
            options:
              - name: --ips
                required: true
                description: Comma-separated IPv4/IPv6 addresses (1-16)
                arguments:
                  - name: ips
                    required: true
                    arity: { minimum: 1, maximum: 1 }
              - name: --rename
                description: New host name; the old name stops resolving
                arguments:
                  - name: host
                    required: true
                    arity: { minimum: 1, maximum: 1 }
          - name: delete
            description: Delete a personal nameserver
            arguments:
              - name: domain
                required: true
                description: Domain name
              - name: host
                required: true
                description: Host label or FQDN

      - name: auth-code
        description: Get transfer authorization code
        arguments:
          - name: domain
            required: true
            description: Domain name

      - name: transfer
        description: Transfer a domain in
        arguments:
          - name: domain
            required: true
            description: Domain name to transfer
        options:
          - name: --auto-renew
            description: Enable auto-renewal
          - name: --privacy
            description: Privacy protection level
            arguments:
              - name: level
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - high
                  - public
          - name: --registrant
            required: true
            description: Registrant contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --admin
            description: Admin contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --tech
            description: Tech contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --billing
            description: Billing contact ID
            arguments:
              - name: id
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --auth-code
            description: Transfer authorization code
            arguments:
              - name: code
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: transfer-status
        description: Get domain transfer status
        arguments:
          - name: domain
            required: true
            description: Domain name

      - name: transfer-lock
        description: Lock or unlock domain transfers
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --lock
            description: Lock the domain
          - name: --unlock
            description: Unlock the domain

  # ── dns ────────────────────────────────────────────────
  - name: dns
    description: DNS record management
    commands:
      - name: list
        description: List DNS records for a domain
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --type
            description: >
              Only records of this type (A, AAAA, CNAME, MX, TXT, SRV, CAA, NS, ALIAS, PTR,
              HTTPS, SVCB, TLSA). The API has no filter, so this pages through the whole zone.
            arguments:
              - name: type
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --name
            description: Only records with this name, e.g. www or @ (pages through the whole zone)
            arguments:
              - name: name
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --all
            description: Fetch every page instead of one
          - name: --order-by
            description: Sort field
            arguments:
              - name: field
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - type
                  - -type
                  - name
                  - -name
          - name: --take
            description: Records per page (1-500, default 100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --skip
            description: Number of records to skip
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: save
        description: |
          Add DNS records, or update the TTL of matching ones, from stdin or file.
          Accepts {"items": [...]} or a bare array. This is not an upsert: a record with the
          same name and type but a different value is added next to the existing one
          (for CNAMEs that leaves duplicates) or rejected with 422, depending on the API's
          conflict checks. To change a value, delete the old record first, then save.
          Record format varies by type:
          - A/AAAA: {"name":"@","type":"A","address":"192.0.2.1","ttl":300}
          - CNAME: {"name":"www","type":"CNAME","cname":"example.com","ttl":300}
          - MX: {"name":"@","type":"MX","exchange":"mail.example.com","preference":10,"ttl":300}
          - TXT: {"name":"@","type":"TXT","value":"v=spf1 include:_spf.example.com ~all","ttl":300}
          - SRV: service, protocol, priority, weight, port, target
          - CAA: flag, tag, value · NS: nameserver · ALIAS: aliasName · PTR: pointer
          - HTTPS/SVCB: svcPriority, targetName, svcParams · TLSA: port, protocol, usage, selector, matching, associationData
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --file
            description: Path to JSON file with records (reads stdin if omitted)
            arguments:
              - name: path
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --force
            description: Turn off the API's conflict checks and force the zone update

      - name: delete
        description: |
          Delete DNS records from stdin or file. Accepts {"items": [...]} or a bare array;
          the API is sent a bare array. Records match on name + type + value; ttl is ignored.
        arguments:
          - name: domain
            required: true
            description: Domain name
        options:
          - name: --file
            description: Path to JSON file with records (reads stdin if omitted)
            arguments:
              - name: path
                required: true
                arity: { minimum: 1, maximum: 1 }

  # ── contacts ───────────────────────────────────────────
  - name: contacts
    description: Contact management
    commands:
      - name: save
        description: Create or update a contact
        options:
          - name: --first-name
            required: true
            description: First name
            arguments:
              - name: name
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --last-name
            required: true
            description: Last name
            arguments:
              - name: name
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --email
            required: true
            description: Email address
            arguments:
              - name: email
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --address
            required: true
            description: Street address
            arguments:
              - name: address
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --city
            required: true
            description: City
            arguments:
              - name: city
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --country
            required: true
            description: Country code (ISO 3166-1 alpha-2)
            arguments:
              - name: code
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --organization
            description: Organization name
            arguments:
              - name: org
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --address2
            description: Address line 2
            arguments:
              - name: address
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --state
            description: State or province
            arguments:
              - name: state
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --postal-code
            description: Postal or ZIP code
            arguments:
              - name: code
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --phone
            required: true
            description: Phone number as +<country code>.<number>, e.g. +46.701234567
            arguments:
              - name: phone
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --phone-ext
            description: Phone extension
            arguments:
              - name: ext
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --fax
            description: Fax number, same format as --phone
            arguments:
              - name: fax
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --fax-ext
            description: Fax extension
            arguments:
              - name: ext
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --tax-number
            description: Tax number
            arguments:
              - name: number
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: get
        description: Get contact details
        arguments:
          - name: id
            required: true
            description: Contact ID

      - name: attributes
        description: Contact attributes (registry-specific data such as tax IDs)
        commands:
          - name: save
            description: Save attributes from stdin or file ({"type":"us"|"ca", ...}); returns the attributes ID
            options:
              - name: --file
                description: Path to JSON file (reads stdin if omitted)
                arguments:
                  - name: path
                    required: true
                    arity: { minimum: 1, maximum: 1 }
          - name: get
            description: Get contact attributes
            arguments:
              - name: id
                required: true
                description: Contact ID

  # ── sellerhub ──────────────────────────────────────────
  - name: sellerhub
    description: SellerHub management
    commands:
      - name: list
        description: List SellerHub domains
        options:
          - name: --take
            description: Number of items to return (1-100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --skip
            description: Number of items to skip
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: get
        description: Get SellerHub domain details
        arguments:
          - name: domain
            required: true
            description: Listed domain name

      - name: create
        description: Create a SellerHub listing from stdin or file
        options:
          - name: --file
            description: Path to JSON file with domain details (reads stdin if omitted)
            arguments:
              - name: path
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: update
        description: Update a SellerHub listing from stdin or file
        arguments:
          - name: domain
            required: true
            description: Listed domain name
        options:
          - name: --file
            description: Path to JSON file with fields to update (reads stdin if omitted)
            arguments:
              - name: path
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: delete
        description: Delete a SellerHub listing
        arguments:
          - name: domain
            required: true
            description: Listed domain name

      - name: checkout
        description: Create a checkout link for a listed domain from stdin or file
        options:
          - name: --file
            description: Path to JSON file with checkout details (reads stdin if omitted)
            arguments:
              - name: path
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: verification
        description: >
          Get ownership verification record options. Pick any one option (OR);
          within it, create all records (AND).

      - name: sold
        description: List sold SellerHub domains (cursor-paged)
        options:
          - name: --take
            description: Number of items to return (1-100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --cursor
            description: Cursor from the previous page
            arguments:
              - name: cursor
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --from
            description: Only sales at or after this time (ISO 8601)
            arguments:
              - name: datetime
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --to
            description: Only sales before this time (ISO 8601)
            arguments:
              - name: datetime
                required: true
                arity: { minimum: 1, maximum: 1 }

      - name: safepay
        description: SafePay (escrow) transactions
        commands:
          - name: list
            description: List SafePay transactions you are a party to
            options:
              - name: --take
                description: Number of items to return (1-100)
                arguments:
                  - name: count
                    required: true
                    arity: { minimum: 1, maximum: 1 }
              - name: --skip
                description: Number of items to skip
                arguments:
                  - name: count
                    required: true
                    arity: { minimum: 1, maximum: 1 }
          - name: get
            description: Get a SafePay transaction
            arguments:
              - name: transaction-id
                required: true
                description: SafePay transaction ID
          - name: create
            description: Create a SafePay transaction from stdin or file
            options:
              - name: --file
                description: Path to JSON file (reads stdin if omitted)
                arguments:
                  - name: path
                    required: true
                    arity: { minimum: 1, maximum: 1 }

  # ── hyperlift ──────────────────────────────────────────
  - name: hyperlift
    description: Hyperlift application hosting
    commands:
      - name: list
        description: List applications
        options:
          - name: --take
            description: Number of items to return (1-100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --skip
            description: Number of items to skip
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
      - name: get
        description: Get an application
        arguments:
          - name: id
            required: true
            description: Application ID
      - name: build
        description: Start a build
        arguments:
          - name: id
            required: true
            description: Application ID
      - name: build-logs
        description: Get build logs (cursor-paged; finished is true when the build is done)
        arguments:
          - name: id
            required: true
            description: Application ID
        options:
          - name: --take
            description: Number of lines (1-100, default 100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --cursor
            description: Cursor from the previous page
            arguments:
              - name: cursor
                required: true
                arity: { minimum: 1, maximum: 1 }
      - name: logs
        description: Get runtime logs (cursor-paged)
        arguments:
          - name: id
            required: true
            description: Application ID
        options:
          - name: --take
            description: Number of lines (1-100, default 100)
            arguments:
              - name: count
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --cursor
            description: Cursor from the previous page
            arguments:
              - name: cursor
                required: true
                arity: { minimum: 1, maximum: 1 }
      - name: metrics
        description: Get application metrics
        arguments:
          - name: id
            required: true
            description: Application ID
        options:
          - name: --start
            required: true
            description: Start of the range, UTC ISO 8601
            arguments:
              - name: datetime
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --end
            required: true
            description: End of the range, UTC ISO 8601
            arguments:
              - name: datetime
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --interval
            required: true
            description: Bucket size, number + s|m|h|d, e.g. 10m (max 1500 buckets)
            arguments:
              - name: interval
                required: true
                arity: { minimum: 1, maximum: 1 }
          - name: --metrics
            required: true
            description: >
              Comma-separated: memoryUsageBytes, cpuUsagePercentage, networkReceiveRateBytes,
              networkTransmitRateBytes, ephemeralStorageUsedMebibytes, persistentStorageUsedMebibytes
            arguments:
              - name: metrics
                required: true
                arity: { minimum: 1, maximum: 1 }
      - name: restart
        description: Restart an application
        arguments:
          - name: id
            required: true
            description: Application ID
      - name: scale
        description: Start or stop an application
        arguments:
          - name: id
            required: true
            description: Application ID
        options:
          - name: --scale
            required: true
            description: 0 stops the application, 1 starts it
            arguments:
              - name: scale
                required: true
                arity: { minimum: 1, maximum: 1 }
                acceptedValues:
                  - "0"
                  - "1"
      - name: env
        description: Environment variables
        commands:
          - name: get
            description: Get environment variables
            arguments:
              - name: id
                required: true
                description: Application ID
          - name: set
            description: >
              Replace ALL environment variables from stdin or file ({"NAME": "value"} or
              {"items": {...}}, max 20). Any variable left out is deleted.
            arguments:
              - name: id
                required: true
                description: Application ID
            options:
              - name: --file
                description: Path to JSON file (reads stdin if omitted)
                arguments:
                  - name: path
                    required: true
                    arity: { minimum: 1, maximum: 1 }

  # ── operations ─────────────────────────────────────────
  - name: operations
    description: Async operation tracking
    commands:
      - name: get
        description: >
          Get async operation status (pending, success or failed). register, renew,
          restore and transfer print the ID as asyncOperationId.
        arguments:
          - name: id
            required: true
            description: Operation ID
